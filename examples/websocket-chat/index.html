<!doctype html>
<html lang="pt-BR" class="h-full bg-[#212121]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chat · Datastar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { chat: { bg: '#212121', panel: '#171717', hover: '#2f2f2f', text: '#ececec', muted: '#a0a0a0' } }, boxShadow: { composer: '0 0 30px rgba(0,0,0,.18)' } } } };
  </script>
  <script defer src="../../bundles/datastar-more-actions.js"></script>
  <script defer src="../../bundles/datastar-a2ui.js"></script>
</head>
<body class="h-full min-h-screen bg-chat-bg text-chat-text antialiased">
  <div class="flex min-h-screen">
    <aside class="hidden w-64 shrink-0 flex-col border-r border-white/5 bg-chat-panel p-3 md:flex">
      <a href="/" class="mb-6 flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold hover:bg-chat-hover" aria-label="Início do chat">
        <span class="grid h-8 w-8 place-items-center rounded-lg border border-white/15 text-lg">✳</span><span>Datastar Chat</span><span class="ml-auto text-chat-muted">⌘</span>
      </a>
      <div class="flex items-center gap-3 rounded-lg bg-white/5 px-3 py-2.5 text-sm"><span class="text-lg">＋</span>Novo chat</div>
      <p class="mb-2 mt-8 px-3 text-xs font-semibold text-chat-muted">Hoje</p>
      <div class="rounded-lg bg-white/5 px-3 py-2.5 text-sm">Canal #chat</div>
      <div class="mt-auto border-t border-white/10 pt-3"><div class="flex items-center gap-3 rounded-lg p-2"><div class="grid h-8 w-8 place-items-center rounded-full bg-emerald-700 text-xs font-semibold">DC</div><div><p class="text-sm">Demonstração</p><p class="text-xs text-chat-muted">WebSocket local</p></div></div></div>
    </aside>
    <main class="flex min-h-screen min-w-0 flex-1 flex-col">
      <header class="flex h-14 items-center justify-between border-b border-white/5 px-4 md:px-6">
        <div class="flex items-center gap-2 text-sm font-medium"><span class="md:hidden">✳</span><span>Chat</span><span class="text-chat-muted">⌄</span></div>
        <div class="flex items-center gap-2 rounded-full border border-white/10 px-3 py-1.5 text-xs text-chat-muted"><span data-ws-indicator class="h-2 w-2 rounded-full bg-amber-400"></span><span data-ws-status>Conectando…</span></div>
      </header>
      <section class="mx-auto flex w-full max-w-3xl flex-1 flex-col px-4 pb-4 md:px-8" data-component="chat" data-a2ui="chat" data-on:load="@ws('chat')">
        <div class="flex flex-1 flex-col justify-end py-8">
          <div class="mb-8 text-center"><div class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-2xl border border-white/10 bg-white/5 text-2xl">✳</div><h1 class="text-2xl font-semibold tracking-tight">Como posso ajudar?</h1><p class="mt-2 text-sm text-chat-muted">Chat de demonstração em tempo real.</p>
            <div class="mx-auto mt-5 flex max-w-2xl flex-wrap justify-center gap-2" aria-label="Solicitar componentes A2UI ao servidor">
              <button type="button" data-a2ui-request="show-card" class="rounded-xl border border-sky-400/30 bg-sky-500/10 px-3 py-2 text-left text-xs text-sky-100 transition hover:bg-sky-500/20 sm:text-sm">Enviar cartão A2UI</button>
              <button type="button" data-a2ui-request="show-status" class="rounded-xl border border-sky-400/30 bg-sky-500/10 px-3 py-2 text-left text-xs text-sky-100 transition hover:bg-sky-500/20 sm:text-sm">Enviar status A2UI</button>
              <button type="button" data-a2ui-request="show-metric" class="rounded-xl border border-sky-400/30 bg-sky-500/10 px-3 py-2 text-left text-xs text-sky-100 transition hover:bg-sky-500/20 sm:text-sm">Enviar métrica A2UI</button>
            </div>
            <div class="mx-auto mt-3 flex max-w-2xl flex-wrap justify-center gap-2" aria-label="Mensagens de exemplo">
              <button type="button" data-chat-prompt="Qual é a capital do Brasil?" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-left text-xs text-gray-200 transition hover:bg-white/10 sm:text-sm">Qual é a capital do Brasil?</button>
              <button type="button" data-chat-prompt="Quanto é 2 + 2?" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-left text-xs text-gray-200 transition hover:bg-white/10 sm:text-sm">Quanto é 2 + 2?</button>
              <button type="button" data-chat-prompt="Repita minha mensagem: teste do botão" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-left text-xs text-gray-200 transition hover:bg-white/10 sm:text-sm">Testar resposta com minha mensagem</button>
            </div>
          </div>
          <div data-ws-messages class="flex max-h-[52vh] min-h-28 flex-col overflow-y-auto px-1" aria-live="polite" aria-label="Mensagens do chat"></div>
          <div data-a2ui-surface class="flex flex-col gap-3 px-1 pt-3" aria-live="polite" aria-label="Componentes A2UI enviados pelo servidor"></div>
        </div>
        <div class="sticky bottom-0 bg-chat-bg pb-3 pt-2">
          <div class="mb-2 flex flex-wrap items-center gap-3 rounded-2xl border border-white/10 bg-white/[.03] px-3 py-2 text-xs text-chat-muted" aria-label="Configurações de voz">
            <label class="flex items-center gap-2"><input id="speech-speak" type="checkbox" checked class="accent-sky-400"> Falar respostas do bot</label>
            <label class="flex items-center gap-2">Transcrição
              <select id="speech-mode" class="rounded-lg border border-white/10 bg-[#2f2f2f] px-2 py-1 text-xs text-white">
                <option value="live">Mostrar enquanto falo</option>
                <option value="pause">Mostrar a cada pausa</option>
              </select>
            </label>
            <button id="speech-mic" type="button" class="rounded-lg border border-sky-400/30 bg-sky-500/10 px-3 py-1.5 text-sky-100 hover:bg-sky-500/20" aria-pressed="false">Ativar microfone</button>
            <span id="speech-status" role="status" aria-live="polite">Voz desativada</span>
          </div>
          <form class="rounded-3xl border border-white/10 bg-[#2f2f2f] p-2 shadow-composer focus-within:border-white/20">
            <label class="sr-only" for="message">Enviar mensagem</label>
            <textarea id="message" name="message" rows="1" required maxlength="2000" autocomplete="off" placeholder="Envie uma mensagem ou use o microfone…" class="max-h-40 min-h-11 w-full resize-y bg-transparent px-3 py-3 text-sm leading-6 text-white outline-none placeholder:text-[#9b9b9b]"></textarea>
            <div class="flex items-center justify-between px-1 pb-1"><span class="px-2 text-xs text-chat-muted">Canal compartilhado: #chat</span><button type="submit" aria-label="Enviar mensagem" title="Enviar mensagem" class="grid h-9 w-9 place-items-center rounded-full bg-white text-black transition hover:bg-gray-200"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
          </form>
          <p class="mt-3 text-center text-[11px] text-chat-muted">Exemplo local · mensagens são enviadas aos clientes conectados ao mesmo canal.</p>
        </div>
      </section>
    </main>
  </div>
  <script>
    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-chat-prompt]');
      if (!button) return;
      const field = document.querySelector('[data-component="chat"] [name="message"]');
      if (!field || !field.form) return;
      field.value = button.dataset.chatPrompt || '';
      field.form.requestSubmit();
    });

    document.addEventListener('keydown', (event) => {
      const field = event.target;
      if (field instanceof HTMLTextAreaElement && field.name === 'message' && event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        field.form?.requestSubmit();
      }
    });

    // Browser-native Web Speech API: speech synthesis for bot replies and speech recognition for dictation.
    (() => {
      const root = document.querySelector('[data-component="chat"]');
      const field = document.querySelector('#message');
      const mic = document.querySelector('#speech-mic');
      const mode = document.querySelector('#speech-mode');
      const speakToggle = document.querySelector('#speech-speak');
      const status = document.querySelector('#speech-status');
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;
      let listening = false;
      let finalTranscript = '';
      let pendingInterim = '';
      let pauseTimer = null;

      const setStatus = (message) => { if (status) status.textContent = message; };
      const renderTranscript = (includeInterim) => {
        const transcript = [finalTranscript.trim(), includeInterim ? pendingInterim.trim() : ''].filter(Boolean).join(' ').trim();
        field.value = transcript.slice(0, 2000);
        field.dispatchEvent(new Event('input', { bubbles: true }));
      };

      if (mic && !Recognition) {
        mic.disabled = true;
        mic.title = 'Este navegador não oferece SpeechRecognition. Tente Chrome ou Edge.';
        setStatus('Reconhecimento de voz indisponível neste navegador');
      }

      if (Recognition) {
        recognition = new Recognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.addEventListener('start', () => {
          listening = true;
          finalTranscript = '';
          pendingInterim = '';
          mic.textContent = 'Parar microfone';
          mic.setAttribute('aria-pressed', 'true');
          setStatus(mode.value === 'live' ? 'Ouvindo · transcrição ao vivo' : 'Ouvindo · transcrição após pausa');
        });

        recognition.addEventListener('result', (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i += 1) {
            const result = event.results[i];
            const text = result[0]?.transcript || '';
            if (result.isFinal) {
              finalTranscript = [finalTranscript.trim(), text.trim()].filter(Boolean).join(' ').trim();
              interim = '';
            } else {
              interim += text;
            }
          }
          pendingInterim = interim.trim();
          if (mode.value === 'live') {
            renderTranscript(true);
          } else {
            clearTimeout(pauseTimer);
            if (pendingInterim) {
              pauseTimer = setTimeout(() => {
                renderTranscript(true);
                setStatus('Pausa detectada · texto atualizado');
              }, 700);
            } else {
              renderTranscript(false);
            }
          }
          if (finalTranscript) {
            renderTranscript(mode.value === 'live');
          }
        });

        recognition.addEventListener('error', (event) => {
          const messages = {
            'not-allowed': 'Permissão de microfone negada',
            'audio-capture': 'Nenhum microfone disponível',
            'no-speech': 'Nenhuma fala detectada',
            'network': 'Falha de rede no reconhecimento de voz'
          };
          setStatus(messages[event.error] || `Erro de reconhecimento: ${event.error}`);
        });

        recognition.addEventListener('end', () => {
          listening = false;
          clearTimeout(pauseTimer);
          mic.textContent = 'Ativar microfone';
          mic.setAttribute('aria-pressed', 'false');
          if (finalTranscript || pendingInterim) renderTranscript(true);
          setStatus('Microfone parado · revise o texto e envie');
        });
      }

      mic?.addEventListener('click', () => {
        if (!recognition) return;
        if (listening) {
          recognition.stop();
          return;
        }
        try {
          window.speechSynthesis?.cancel();
          recognition.start();
        } catch (error) {
          setStatus(`Não foi possível iniciar o microfone: ${error.message}`);
        }
      });

      mode?.addEventListener('change', () => {
        if (!listening) setStatus(mode.value === 'live' ? 'Transcrição ao vivo selecionada' : 'Transcrição após pausa selecionada');
      });

      root?.addEventListener('datastar:ws-message', (event) => {
        const payload = event.detail;
        if (!speakToggle?.checked || payload?.role !== 'assistant' || typeof payload.text !== 'string' || !payload.text.trim()) return;
        if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
          setStatus('Síntese de voz indisponível neste navegador');
          return;
        }
        const text = payload.text.trim();
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.onstart = () => setStatus('Lendo a resposta do bot…');
        utterance.onend = () => setStatus(listening ? 'Ouvindo…' : 'Resposta falada');
        utterance.onerror = () => setStatus('Não foi possível falar a resposta');
        window.speechSynthesis.speak(utterance);
      });

      // If recognition is started, stop any ongoing bot speech to avoid transcribing the speaker.
      mic?.addEventListener('click', () => {
        if (!listening) window.speechSynthesis?.cancel();
      });
    })();
  </script>
</body>
</html>
