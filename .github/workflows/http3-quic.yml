name: HTTP/3 QUIC integration

on:
  pull_request:
    paths:
      - "tests/http3/**"
      - "examples/http3/**"
      - "docs/transport/sse-over-http3.md"
      - ".github/workflows/http3-quic.yml"
  push:
    branches: [develop]
    paths:
      - "tests/http3/**"
      - "examples/http3/**"
      - "docs/transport/sse-over-http3.md"
      - ".github/workflows/http3-quic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quic-sse-integration:
    name: QUIC handshake + HTTP/3 + Datastar SSE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: tests/http3/go.sum
      - name: Download dependencies
        working-directory: tests/http3
        run: go mod tidy
      - name: Run QUIC and SSE integration tests
        working-directory: tests/http3
        run: go test -v -count=1 -timeout=60s ./...
